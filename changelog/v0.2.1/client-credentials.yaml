changelog:
  - type: NEW_FEATURE
    issueLink: https://github.com/solo-io/gloo-gateway/issues/2747
    resolvesIssue: false
    description: >-
      The App details page gains a Client Credentials section for creating,
      listing and deleting client ID / client secret pairs. The secret is shown
      once, when the pair is created. The section is hidden when the portal
      server has no client credentials route. VITE_DEFAULT_APP_AUTH now takes a
      comma-separated list of "OAUTH", "API_KEY" and "CLIENT_CREDENTIALS", so
      any combination of sections can be shown; "ALL", the default, includes
      the new section. In the Swagger view, the Authorize dialog puts API key
      schemes that one security requirement names together into one form with
      one Authorize button, shows the client ID rather than masking it once
      authorized, and stays open when the user switches to another window and
      back, unless the spec itself changed. The API Keys and Client Credentials
      sections now say when their list cannot be loaded, rather than showing a
      loading indicator indefinitely, and the delete confirmation names the
      credential it is about to delete.
