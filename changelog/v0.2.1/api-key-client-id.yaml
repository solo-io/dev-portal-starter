changelog:
  - type: NEW_FEATURE
    issueLink: https://github.com/solo-io/gloo-gateway/issues/2747
    resolvesIssue: false
    description: >-
      The App details page gains an API Keys with Client ID section for
      creating, listing and deleting API keys that are sent together with a
      client ID. The API key is shown once, when it is created. The section
      requires a portal server that serves the client IDs API (Gloo Gateway
      2.4.0 or later); against an older portal server it reports that its list
      could not be loaded, so leave "API_KEY_CLIENT_ID" out of
      VITE_DEFAULT_APP_AUTH there. VITE_DEFAULT_APP_AUTH now takes a
      comma-separated list of "OAUTH",
      "API_KEY" and "API_KEY_CLIENT_ID", so any combination of sections can be
      shown; "ALL", the default, includes the new section. In the Swagger view,
      the Authorize dialog puts API key schemes that one security requirement
      names together into one form with one Authorize button, shows the client
      ID rather than masking it once authorized, and stays open when the user
      switches to another window and back, unless the spec itself changed. The
      API Keys and API Keys with Client ID sections now say when their list
      cannot be loaded, rather than showing a loading indicator indefinitely,
      and the delete confirmation names the credential it is about to delete.
