name: Build UI
description: Builds the UI.
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: ".nvmrc"
        cache: "yarn"
        cache-dependency-path: "projects/ui/yarn.lock"
    - name: Build
      shell: bash
      run: |
        make build-ui
